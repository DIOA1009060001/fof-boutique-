<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOF Boutique - Gagnoa Commerce</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f6f6f6;color:#111}
header{background:#0f0f0f;color:#fff;padding:20px;text-align:center;position:sticky;top:0;z-index:20}
.banner{background:#ffe600;text-align:center;padding:12px;font-weight:800;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;max-width:1200px;margin:auto}
@media(min-width:800px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.08);display:flex;flex-direction:column}
.card img{width:100%;height:230px;object-fit:cover;background:#eee}
.info{padding:12px 12px 0 12px}.name{font-weight:800;font-size:14px;min-height:36px}.price{color:#e11d48;font-weight:900;font-size:16px;margin-top:8px}
.sizes{font-size:11px;color:#555;background:#f3f3f3;padding:4px 8px;border-radius:20px;display:inline-block;margin-top:4px}
.btn{margin:12px;background:#111;color:#fff;border:none;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}
.wa{position:fixed;bottom:18px;left:16px;right:16px;background:#25D366;color:#fff;border-radius:16px;padding:16px;text-align:center;font-weight:900;text-decoration:none}
@media(min-width:600px){.wa{left:auto;width:320px}}
</style>
</head>
<body>
<header><h1>FOF BOUTIQUE 👟</h1><div>📍 Gagnoa - Commerce | 37 à 45 | Livraison Abidjan & Gagnoa</div></header>
<div class="banner">🔥 12.000F à 15.000F - Paye à la livraison - WhatsApp: 05 66 40 75 88</div>
<div id="grid" class="grid"></div>
<a class="wa" href="https://wa.me/2250566407588">💬 Commander sur WhatsApp - 05 66 40 75 88</a>
<script>
const API="https://api.github.com/repos/DIOA1009060001/Diomande-ida-2026/contents/image";
const RAW="https://raw.githubusercontent.com/DIOA1009060001/Diomande-ida-2026/main/image/";
const PRODUCTS=[["New Balance 530 - Blanche/Gris","15.000F"],["Adidas Campus Noir/Blanc / Rose / Marron","13.000F"],["Nike TN - Blanche/Noir","15.000F"],["Jordan 4 Blanc/Noir","13.000F"],["Vans Noir/Blanc","13.000F"],["NB 9060 Triple Black - Noir/Beige","15.000F"],["Nike Shox TL Triple Black - Noir","15.000F"],["Air Force 1 Black Python - Python Noir","15.000F"],["Puma Suede XL - Noir / Rouge / Bleu","15.000F"],["Nike Air Max - Blanc / Noir","15.000F"],["Adidas Runfalcon - Noir/Blanc","12.000F"],["Asics Gel-Kayano - Blanc/Noir","15.000F"],["TN Full White","15.000F"],["OGYI - Noir/Bleu","15.000F"],["Samba - Noir/Blanc","15.000F"]];
const grid=document.getElementById('grid');
async function load(){
 const r=await fetch(API); const files=await r.json();
 const imgs=files.filter(f=>f.name.match(/\.(jpg|jpeg|png|webp)$/i)).sort((a,b)=>a.name.localeCompare(b.name));
 grid.innerHTML="";
 imgs.forEach((file,i)=>{
  const p=PRODUCTS[i%PRODUCTS.length];
  grid.innerHTML+=`<div class="card"><img src="${RAW+file.name}" loading="lazy"><div class="info"><div class="name">${p[0]}</div><div class="price">${p[1]}</div><div class="sizes">37 38 39 40 41 42 43 44 45</div></div><button class="btn" onclick="window.open('https://wa.me/2250566407588?text=Salut FOF Boutique je veux commander ${encodeURIComponent(p[0])} ${p[1]}')">Commander - ${p[1]}</button></div>`;
 });
}
load();
function order(n,p){window.open(`https://wa.me/2250566407588?text=Je veux ${n} ${p}`)}
</script>
</body>
</html>
